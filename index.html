<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="InkSpace - A modern blogging platform for writers and readers.">
    <title>InkSpace | Modern Blogging Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Reading Progress Bar -->
    <div class="reading-progress" id="readingProgress"></div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="#/" class="nav-logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                InkSpace
            </a>

            <ul class="nav-menu" id="navMenu">
                <li class="nav-item"><a href="#/" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="#/explore" class="nav-link">Explore</a></li>
                <li class="nav-item"><a href="#/dashboard" class="nav-link">Dashboard</a></li>
                <li class="nav-item"><a href="#/bookmarks" class="nav-link">Bookmarks</a></li>
                <li class="nav-item nav-auth-mobile">
                    <a href="#/login" class="btn btn-outline">Login</a>
                    <a href="#/register" class="btn btn-primary">Register</a>
                </li>
            </ul>

            <div class="nav-actions">
                <button class="icon-btn search-toggle" id="searchToggle" aria-label="Search">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
                <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">
                    <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
                <div class="notification-dropdown">
                    <button class="icon-btn" id="notifToggle" aria-label="Notifications">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                        <span class="notif-badge" id="notifBadge"></span>
                    </button>
                    <div class="dropdown-menu notif-menu" id="notifMenu">
                        <div class="dropdown-header">
                            <h4>Notifications</h4>
                            <button id="markAllRead">Mark all read</button>
                        </div>
                        <div class="dropdown-body" id="notifBody"></div>
                    </div>
                </div>
                <div class="profile-dropdown">
                    <button class="avatar-btn" id="profileToggle">
                        <img src="https://i.pravatar.cc/150?img=12" alt="Profile" class="avatar">
                    </button>
                    <div class="dropdown-menu profile-menu" id="profileMenu">
                        <a href="#/profile">Profile</a>
                        <a href="#/dashboard">Dashboard</a>
                        <a href="#/settings">Settings</a>
                        <button class="logout-btn" id="logoutBtn">Logout</button>
                    </div>
                </div>
                <button class="icon-btn nav-hamburger" id="hamburgerToggle" aria-label="Menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
            </div>
        </div>
        <div class="search-bar-container" id="searchBar">
            <input type="text" placeholder="Search articles, authors, tags..." id="globalSearchInput">
            <button class="btn btn-primary">Search</button>
        </div>
    </nav>

    <!-- Main View -->
    <main id="app" class="main-container">
        <!-- Views injected via JS -->
        <div class="loader-container">
            <div class="loader-spinner"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-brand">
                <h3>InkSpace</h3>
                <p>A modern platform for thinkers, creators, and storytellers.</p>
            </div>
            <div class="footer-links">
                <div class="link-group">
                    <h4>Platform</h4>
                    <a href="#/explore">Explore</a>
                    <a href="#/dashboard">Dashboard</a>
                </div>
                <div class="link-group">
                    <h4>Company</h4>
                    <a href="#/">About</a>
                    <a href="#/">Careers</a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2023 InkSpace. All rights reserved.</p>
        </div>
    </footer>

    <!-- Modal Container -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent">
            <!-- Modal content injected via JS -->
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="js/app.js"></script>
</body>
</html>
